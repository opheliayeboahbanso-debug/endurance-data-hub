<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boss Test Order</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      padding: 30px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    button {
      background: #111827;
      color: white;
      border: 0;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    pre {
      margin-top: 25px;
      text-align: left;
      background: #111827;
      color: white;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🧪 Boss Test Order</h1>

  <p>
    Testing:
    <strong>MTN 1GB</strong>
  </p>

  <p>
    Beneficiary:
    <strong>0548476789</strong>
  </p>

  <button id="testButton">
    Place Test Order
  </button>

  <pre id="result">Waiting for test...</pre>

</div>

<script>
document.getElementById("testButton").addEventListener("click", async () => {

  const button = document.getElementById("testButton");
  const result = document.getElementById("result");

  button.disabled = true;
  result.textContent = "Sending test order to Boss...";

  try {

    const response = await fetch("/api/test-order", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      }
    });

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      data = {
        raw_response: text
      };
    }

    result.textContent =
      JSON.stringify(data, null, 2);

  } catch (error) {

    result.textContent =
      "ERROR:\n" + error.message;

  } finally {

    button.disabled = false;

  }

});
</script>

</body>
</html>
