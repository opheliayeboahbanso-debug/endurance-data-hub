<!doctype html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment Processing - Endurance Data Hub</title>  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f8ff;
      color: #101828;
    }

    .card {
      width: min(92%, 500px);
      background: #fff;
      border: 1px solid #e4e7ec;
      border-radius: 24px;
      padding: 35px;
      text-align: center;
      box-sizing: border-box;
      box-shadow: 0 20px 50px rgba(23, 70, 255, 0.10);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
    }

    #message {
      color: #667085;
      line-height: 1.6;
    }

    .ref {
      background: #f8f9fb;
      padding: 13px;
      border-radius: 10px;
      word-break: break-all;
      margin-top: 20px;
      font-size: 13px;
    }

    a {
      display: inline-block;
      margin-top: 22px;
      background: #1746ff;
      color: #fff;
      padding: 13px 20px;
      border-radius: 11px;
      text-decoration: none;
      font-weight: 800;
    }

    .hidden {
      display: none !important;
    }
  </style></head><body><div class="card">  <div id="icon" class="icon">⏳</div>  <h1 id="title">Checking payment...</h1>  <p id="message">
    Please wait while we confirm your payment and process your data order.
  </p>  <div id="reference" class="ref hidden"></div>  <a href="/" id="home" class="hidden">
    Return to Endurance Data Hub
  </a></div><script>
(async function () {

  const params = new URLSearchParams(window.location.search);

  const reference = params.get("reference");

  const title =
    document.getElementById("title");

  const message =
    document.getElementById("message");

  const referenceBox =
    document.getElementById("reference");

  const home =
    document.getElementById("home");

  const icon =
    document.getElementById("icon");


  /* ==========================================
     CHECK FOR PAYMENT REFERENCE
     ========================================== */

  if (!reference) {

    icon.textContent = "❌";

    title.textContent =
      "Payment reference missing";

    message.textContent =
      "We couldn't find the Paystack transaction reference.";

    home.classList.remove("hidden");

    return;
  }


  referenceBox.textContent =
    "Payment reference: " + reference;

  referenceBox.classList.remove("hidden");


  /* ==========================================
     CHECK PENDING ORDER
     ========================================== */

  const pending =
    sessionStorage.getItem("pendingOrder");


  if (!pending) {

    /*
      The order may already have been processed,
      so we still try complete-order below.
    */

    console.log(
      "No pending order found in sessionStorage."
    );
  }


  try {

    /* ==========================================
       COMPLETE ORDER
       ========================================== */

    const response =
      await fetch("/api/complete-order", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          reference: reference
        })

      });


    const result =
      await response.json();


    /* ==========================================
       SUCCESS
       ========================================== */

    if (response.ok && result.success) {

      icon.textContent = "🎉";

      title.textContent =
        result.already_processed
          ? "Order already processed"
          : "Payment successful!";

      message.textContent =
        result.already_processed
          ? "This payment has already been processed. Your data order has been submitted."
          : "Your payment has been confirmed and your data order has been submitted successfully.";


      const bossOrder =
        result.boss_order || {};

      const bossData =
        bossOrder.data || bossOrder;


      if (bossData.reference) {

        referenceBox.textContent =
          "Order reference: " +
          bossData.reference;

      }


      sessionStorage.removeItem(
        "pendingOrder"
      );


      home.classList.remove("hidden");

      return;
    }


    /* ==========================================
       ORDER PROCESSING
       ========================================== */

    if (response.status === 409) {

      icon.textContent = "⏳";

      title.textContent =
        "Order is being processed";

      message.textContent =
        "Your payment was received and your data order is currently being processed. Please wait a moment and check your order status.";

      home.classList.remove("hidden");

      return;
    }


    /* ==========================================
       PAYMENT SUCCESS BUT ORDER FAILED
       ========================================== */

    throw new Error(
      result.error ||
      "Payment could not be completed."
    );


  } catch (error) {

    console.error(
      "CALLBACK ERROR:",
      error
    );


    icon.textContent = "⚠️";

    title.textContent =
      "Payment received — order needs attention";

    message.textContent =
      error.message ||
      "We couldn't complete the data order automatically. Please keep your payment reference and contact Endurance Data Hub.";

    home.classList.remove("hidden");

  }

})();
</script></body>
</html>
